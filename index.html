<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Название и режим приложения на весь экран -->
  <title>ДНЕВНИК</title>
  <meta name="apple-mobile-web-app-title" content="ДНЕВНИК">
  <meta name="application-name" content="ДНЕВНИК">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#141517">

  <!-- Иконки для iPhone и Android -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141517; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="appFrame" src=""></iframe>
  <script>
    const CLIENTS = {
      'shablon': 'https://google.com',
      'demo': 'https://google.com'
    };

    const params = new URLSearchParams(window.location.search);
    const clientKey = params.get('c') || 'shablon';
    const targetUrl = CLIENTS[clientKey] || CLIENTS['shablon'];
    document.getElementById('appFrame').src = targetUrl;
  </script>
</body>
</html>
