<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>СИСТЕМА ТЕЛА — Дневник</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141517; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="appFrame" src=""></iframe>
  <script>
    // База ссылок ваших клиентов (добавляете сюда нового клиента за 5 секунд)
    const CLIENTS = {
      'shablon': 'https://script.google.com/macros/s/AKfycbwPd0jB0pmqCieI_ysZLhM06ROrI3KIRSG_jKciTwQsG5keZSjZS-dReMQ4l1xjd9Qs/exec',
      'demo': 'https://google.com'
    };

    const params = new URLSearchParams(window.location.search);
    const clientKey = params.get('c') || 'demo';
    const targetUrl = CLIENTS[clientKey] || CLIENTS['demo'];
    document.getElementById('appFrame').src = targetUrl;
  </script>
</body>
</html>
